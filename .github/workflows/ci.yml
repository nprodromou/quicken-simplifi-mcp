name: ci

# Pull requests -> typecheck, unit tests, build the image, and smoke-run it (no push).
# Push to main  -> the same, then the publish job builds, smoke-runs and pushes
#                  to GHCR as `latest` and `sha-<short>`.
# apk8s pins `sha-<short>`; `latest` is a convenience, never deployed.
#
# Only the publish job can write packages, and it runs only on a push to main.
# Every job a pull request can reach runs PR-controlled code (install scripts,
# tests, the Dockerfile, the smoke script), so those jobs get a read-only token
# and no persisted git credential.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/nprodromou/quicken-simplifi-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: yarn
      - run: yarn install --frozen-lockfile
      # `yarn run`, not bare `yarn check`: Yarn 1 has a built-in `check` that
      # would shadow the script and typecheck nothing.
      - run: yarn run check
      - run: yarn run test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build (loaded locally for the smoke run)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: quicken-simplifi-mcp:smoke
      - name: Smoke-run the built image
        run: bash scripts/smoke.sh quicken-simplifi-mcp:smoke

  publish:
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build (loaded locally for the smoke run)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: quicken-simplifi-mcp:smoke
      - name: Smoke-run the image about to be pushed
        run: bash scripts/smoke.sh quicken-simplifi-mcp:smoke
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image that passed the smoke run
        run: |
          short="${GITHUB_SHA::7}"
          docker tag quicken-simplifi-mcp:smoke "$IMAGE:sha-$short"
          docker tag quicken-simplifi-mcp:smoke "$IMAGE:latest"
          docker push "$IMAGE:sha-$short"
          docker push "$IMAGE:latest"
